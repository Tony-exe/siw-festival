<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${salaId} == null ? 'Nuova sala' : 'Modifica sala')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="stretta">
    <h1 th:text="${salaId} == null ? 'Nuova sala' : 'Modifica sala'">Sala</h1>

    <form th:action="${salaId} == null ? @{/admin/sale} : @{/admin/sale/{id}(id=${salaId})}"
          th:object="${sala}" method="post" novalidate>
        <th:block th:replace="~{fragments/layout :: campo('nome', 'Nome', 'text')}"></th:block>
        <th:block th:replace="~{fragments/layout :: campo('indirizzo', 'Indirizzo', 'text')}"></th:block>
        <th:block th:replace="~{fragments/layout :: campo('capienza', 'Capienza (posti)', 'number')}"></th:block>
        <button type="submit">Salva</button>
        <a th:href="@{/admin/sale}">Annulla</a>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
