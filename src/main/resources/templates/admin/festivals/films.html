<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Film · ' + ${festival.nome})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>
    <p class="percorso"><a th:href="@{/admin/festivals}">Festival</a> / <span th:text="${festival.nome}">Festival</span></p>
    <h1>Film partecipanti</h1>

    <form th:action="@{/admin/festivals/{id}/films(id=${festival.id})}" method="post" class="riquadro"
          th:if="${!#lists.isEmpty(associabili)}">
        <label for="filmId">Film da aggiungere</label>
        <select id="filmId" name="filmId" required>
            <option th:each="film : ${associabili}" th:value="${film.id}"
                    th:text="${film.titolo + ' (' + film.anno + ') – ' + film.regista.cognome}">Film</option>
        </select>
        <button type="submit">Aggiungi al festival</button>
    </form>

    <table>
        <thead>
        <tr><th>Titolo</th><th>Regista</th><th>Anno</th><th>Azioni</th></tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(films)}"><td colspan="4" class="nota">Nessun film associato.</td></tr>
        <tr th:each="film : ${films}">
            <td th:text="${film.titolo}">Titolo</td>
            <td th:text="${film.regista.nome + ' ' + film.regista.cognome}">Regista</td>
            <td th:text="${film.anno}">Anno</td>
            <td>
                <!-- POST (non un link GET): un'azione che modifica i dati richiede il token CSRF -->
                <form th:action="@{/admin/festivals/{id}/films/{filmId}/remove(id=${festival.id}, filmId=${film.id})}"
                      method="post" onsubmit="return confirm('Rimuovere il film? Le sue proiezioni programmate in questo festival saranno annullate.')">
                    <button type="submit">Rimuovi</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
