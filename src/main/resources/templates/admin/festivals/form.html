<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${festivalId} == null ? 'Nuovo festival' : 'Modifica festival')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="stretta">
    <h1 th:text="${festivalId} == null ? 'Nuovo festival' : 'Modifica festival'">Festival</h1>

    <!-- Stesso template per inserimento e modifica: cambia solo l'URL del POST -->
    <form th:action="${festivalId} == null ? @{/admin/festivals} : @{/admin/festivals/{id}(id=${festivalId})}"
          th:object="${festival}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: erroriGlobali}"></div>

        <th:block th:replace="~{fragments/layout :: campo('nome', 'Nome', 'text')}"></th:block>
        <th:block th:replace="~{fragments/layout :: campo('citta', 'Città', 'text')}"></th:block>
        <th:block th:replace="~{fragments/layout :: campo('anno', 'Anno (edizione)', 'number')}"></th:block>
        <th:block th:replace="~{fragments/layout :: campo('dataInizio', 'Data di inizio', 'date')}"></th:block>
        <th:block th:replace="~{fragments/layout :: campo('dataFine', 'Data di fine', 'date')}"></th:block>

        <label for="descrizione">Descrizione</label>
        <textarea th:field="*{descrizione}" rows="4" th:errorclass="campo-errore"></textarea>
        <span class="errore-campo" th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}"></span>

        <button type="submit">Salva</button>
        <a th:href="@{/admin/festivals}">Annulla</a>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
