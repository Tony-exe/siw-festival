<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proiezioni · ' + ${festival.nome})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>
    <p class="percorso"><a th:href="@{/admin/festivals}">Festival</a> / <span th:text="${festival.nome}">Festival</span></p>
    <h1>Proiezioni</h1>
    <p class="nota">
        Periodo del festival:
        <span th:text="${#temporals.format(festival.dataInizio, 'dd/MM/yyyy')}">01/01</span> –
        <span th:text="${#temporals.format(festival.dataFine, 'dd/MM/yyyy')}">10/01</span>
    </p>

    <div class="colonne larga-stretta">
        <table>
            <thead>
            <tr><th>Data</th><th>Orario</th><th>Film</th><th>Sala</th><th>Stato</th><th>Azioni</th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(proiezioni)}"><td colspan="6" class="nota">Nessuna proiezione.</td></tr>
            <!-- film e sala sono già caricati (JOIN FETCH in ProiezioneRepository.findProgramma) -->
            <tr th:each="p : ${proiezioni}" th:classappend="${p.stato.name() == 'CANCELLED'} ? 'annullata'">
                <td th:text="${#temporals.format(p.data, 'EEE dd/MM')}">lun 01/01</td>
                <td th:text="${#temporals.format(p.ora, 'HH:mm') + '–' + #temporals.format(p.oraFine, 'HH:mm')}">14:00–16:00</td>
                <td th:text="${p.film.titolo}">Film</td>
                <td th:text="${p.sala.nome}">Sala</td>
                <!-- classe "stato scheduled", "stato completed" o "stato cancelled": colore in app.css -->
                <td><span th:class="'stato ' + ${#strings.toLowerCase(p.stato)}" th:text="${p.stato}">SCHEDULED</span></td>
                <td class="azioni">
                    <th:block th:if="${p.modificabile}">
                        <a th:href="@{/admin/proiezioni/{id}/edit(id=${p.id})}">Modifica</a>
                        <form th:action="@{/admin/proiezioni/{id}/completa(id=${p.id})}" method="post">
                            <button type="submit" class="secondario">Completata</button>
                        </form>
                        <form th:action="@{/admin/proiezioni/{id}/annulla(id=${p.id})}" method="post"
                              onsubmit="return confirm('Annullare la proiezione?')">
                            <button type="submit">Annulla</button>
                        </form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>

        <form th:action="@{/admin/festivals/{id}/proiezioni(id=${festival.id})}" th:object="${form}" method="post"
              class="riquadro" novalidate>
            <h2>Programma una proiezione</h2>
            <div th:replace="~{fragments/layout :: erroriGlobali}"></div>

            <label for="filmId">Film</label>
            <select id="filmId" name="filmId" required>
                <option value="">— scegli il film —</option>
                <option th:each="film : ${films}" th:value="${film.id}"
                        th:text="${film.titolo + ' (' + film.durata + ' min)'}"
                        th:selected="${filmId != null and filmId == film.id}">Film</option>
            </select>
            <p class="nota" th:if="${#lists.isEmpty(films)}">
                Prima <a th:href="@{/admin/festivals/{id}/films(id=${festival.id})}">associa dei film</a> al festival.
            </p>
            <th:block th:replace="~{admin/proiezioni/form :: selectSala}"></th:block>
            <th:block th:replace="~{fragments/layout :: campo('data', 'Data', 'date')}"></th:block>
            <th:block th:replace="~{fragments/layout :: campo('ora', 'Ora di inizio', 'time')}"></th:block>
            <button type="submit">Programma</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
