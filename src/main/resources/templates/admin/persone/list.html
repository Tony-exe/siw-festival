<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titolo})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>
    <!-- Template condiviso da registi e attori: "base" è /admin/registi oppure /admin/attori -->
    <div class="titolo-pagina">
        <h1 th:text="${titolo}">Persone</h1>
        <a th:href="@{__${base}__/new}" class="pulsante">Nuovo</a>
    </div>

    <table>
        <thead>
        <tr><th>Cognome e nome</th><th>Data di nascita</th><th>Nazionalità</th><th>Azioni</th></tr>
        </thead>
        <tbody>
        <tr th:each="persona : ${persone}">
            <td th:text="${persona.cognome + ' ' + persona.nome}">Cognome Nome</td>
            <td th:text="${#temporals.format(persona.dataNascita, 'dd/MM/yyyy')}">01/01/1970</td>
            <td th:text="${persona.nazionalita}">Italiana</td>
            <td><a th:href="@{__${base}__/{id}/edit(id=${persona.id})}">Modifica</a></td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
