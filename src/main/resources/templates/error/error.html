<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{errore.titolo})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="pagina-errore">
    <!-- "status" lo fornisce Spring Boot (BasicErrorController) o il nostro GlobalExceptionHandler -->
    <h1 th:text="${status} ?: 'Errore'">Errore</h1>
    <p th:text="${messaggio} ?: #{errore.testo}">Si è verificato un errore imprevisto.</p>
    <a th:href="@{/}" class="pulsante" th:text="#{errore.torna}">Torna alla home</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
