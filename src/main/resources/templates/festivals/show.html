<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${festival.nome})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>
    <p class="percorso"><a th:href="@{/festivals}">Festival</a> / <span th:text="${festival.nome}">Festival</span></p>

    <h1 th:text="${festival.nome}">Nome festival</h1>
    <p class="nota">
        <span th:text="${festival.citta}">Città</span> · edizione <span th:text="${festival.anno}">2026</span> ·
        dal <span th:text="${#temporals.format(festival.dataInizio, 'dd/MM/yyyy')}">01/01</span>
        al <span th:text="${#temporals.format(festival.dataFine, 'dd/MM/yyyy')}">10/01</span>
    </p>
    <p th:text="${festival.descrizione}">Descrizione</p>

    <div class="azioni">
        <a th:href="@{/festivals/{id}/films(id=${festival.id})}" class="pulsante">Film partecipanti</a>
        <!-- Pagina React (stessa applicazione, stessa sessione) -->
        <a th:href="@{/app/festivals/{id}/screenings(id=${festival.id})}" class="pulsante">Programma delle proiezioni</a>
        <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin/festivals/{id}/proiezioni(id=${festival.id})}"
           class="pulsante secondario">Gestisci programmazione</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
